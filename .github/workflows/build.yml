package com.example.screeninstanttranslator

import android.accessibilityservice.AccessibilityService
import android.graphics.Color
import android.graphics.PixelFormat
import android.graphics.drawable.GradientDrawable
import android.os.Handler
import android.os.Looper
import android.view.Gravity
import android.view.MotionEvent
import android.view.View
import android.view.WindowManager
import android.view.accessibility.AccessibilityEvent
import android.view.accessibility.AccessibilityNodeInfo
import android.widget.LinearLayout
import android.widget.ScrollView
import android.widget.TextView
import org.json.JSONArray
import java.net.HttpURLConnection
import java.net.URL
import java.net.URLEncoder
import java.util.concurrent.Executors

class ScreenTranslatorService : AccessibilityService() {

    private lateinit var windowManager: WindowManager
    private lateinit var floatingRootLayout: LinearLayout
    private lateinit var headerLayout: LinearLayout
    private lateinit var toggleButton: TextView
    private lateinit var closeButton: TextView
    private lateinit var resultScrollView: ScrollView
    private lateinit var resultTextView: TextView

    private var isAutoTranslating = false
    private var lastExtractedText = ""
    private val executor = Executors.newSingleThreadExecutor()
    private val mainHandler = Handler(Looper.getMainLooper())
    private var debounceRunnable: Runnable? = null

    override fun onServiceConnected() {
        super.onServiceConnected()
        setupFloatingOverlay()
    }

    private fun setupFloatingOverlay() {
        windowManager = getSystemService(WINDOW_SERVICE) as WindowManager

        val params = WindowManager.LayoutParams(
            WindowManager.LayoutParams.WRAP_CONTENT,
            WindowManager.LayoutParams.WRAP_CONTENT,
            WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
            WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
            PixelFormat.TRANSLUCENT
        ).apply {
            gravity = Gravity.TOP or Gravity.START
            x = 20
            y = 250
        }

        floatingRootLayout = LinearLayout(this).apply {
            orientation = LinearLayout.VERTICAL
        }

        headerLayout = LinearLayout(this).apply {
            orientation = LinearLayout.HORIZONTAL
            gravity = Gravity.CENTER_VERTICAL
        }

        toggleButton = TextView(this).apply {
            text = "🌐 點擊啟動即時翻"
            setTextColor(Color.WHITE)
            textSize = 14f
            setPadding(28, 20, 28, 20)
            background = GradientDrawable().apply {
                setColor(Color.parseColor("#E61A73E8"))
                cornerRadius = 40f
            }
        }

        closeButton = TextView(this).apply {
            text = " ✕ "
            setTextColor(Color.WHITE)
            textSize = 16f
            setPadding(20, 20, 20, 20)
            background = GradientDrawable().apply {
                setColor(Color.parseColor("#E6D32F2F"))
                cornerRadius = 40f
            }
            setOnClickListener {
                stopSelf()
            }
        }

        val headerParams = LinearLayout.LayoutParams(
            LinearLayout.LayoutParams.WRAP_CONTENT,
            LinearLayout.LayoutParams.WRAP_CONTENT
        ).apply {
            rightMargin = 12
        }

        headerLayout.addView(toggleButton, headerParams)
        headerLayout.addView(closeButton)

        resultTextView = TextView(this).apply {
            setTextColor(Color.WHITE)
            textSize = 14.5f
            setLineSpacing(8f, 1.1f)
            setPadding(28, 24, 28, 24)
            text = "等待畫面英文內容..."
        }

        resultScrollView = ScrollView(this).apply {
            visibility = View.GONE
            background = GradientDrawable().apply {
                setColor(Color.parseColor("#D91E1E1E"))
                cornerRadius = 28f
                setStroke(2, Color.parseColor("#4DFFFFFF"))
            }
            layoutParams = LinearLayout.LayoutParams(820, 650).apply { topMargin = 12 }
            addView(resultTextView)
        }

        floatingRootLayout.addView(headerLayout)
        floatingRootLayout.addView(resultScrollView)
        windowManager.addView(floatingRootLayout, params)

        var initialX = 0
        var initialY = 0
        var initialTouchX = 0f
        var initialTouchY = 0f

        toggleButton.setOnTouchListener { _, event ->
            when (event.action) {
                MotionEvent.ACTION_DOWN -> {
                    initialX = params.x
                    initialY = params.y
                    initialTouchX = event.rawX
                    initialTouchY = event.rawY
                    true
                }
                MotionEvent.ACTION_MOVE -> {
                    params.x = initialX + (event.rawX - initialTouchX).toInt()
                    params.y = initialY + (event.rawY - initialTouchY).toInt()
                    windowManager.updateViewLayout(floatingRootLayout, params)
                    true
                }
                MotionEvent.ACTION_UP -> {
                    if (Math.abs(event.rawX - initialTouchX) < 15 && Math.abs(event.rawY - initialTouchY) < 15) {
                        toggleTranslationMode()
                    }
                    true
                }
                else -> false
            }
        }
    }

    private fun toggleTranslationMode() {
        isAutoTranslating = !isAutoTranslating
        if (isAutoTranslating) {
            toggleButton.text = "🟢 即時翻譯中"
            toggleButton.background = GradientDrawable().apply {
                setColor(Color.parseColor("#E60F9D58"))
                cornerRadius = 40f
            }
            resultScrollView.visibility = View.VISIBLE
            lastExtractedText = ""
            scanAndTranslateScreen()
        } else {
            toggleButton.text = "🌐 點擊啟動即時翻"
            toggleButton.background = GradientDrawable().apply {
                setColor(Color.parseColor("#E61A73E8"))
                cornerRadius = 40f
            }
            resultScrollView.visibility = View.GONE
        }
    }

    override fun onAccessibilityEvent(event: AccessibilityEvent?) {
        if (!isAutoTranslating) return
        if (event?.packageName == packageName) return
        debounceRunnable?.let { mainHandler.removeCallbacks(it) }
        debounceRunnable = Runnable { scanAndTranslateScreen() }
        mainHandler.postDelayed(debounceRunnable!!, 600)
    }

    private fun scanAndTranslateScreen() {
        val rootNode = rootInActiveWindow ?: return
        val englishParagraphs = mutableListOf<String>()
        extractEnglishNodes(rootNode, englishParagraphs)
        val combinedText = englishParagraphs.distinct().take(10).joinToString("\n\n")
        if (combinedText.isBlank() || combinedText == lastExtractedText) return
        lastExtractedText = combinedText
        mainHandler.post { resultTextView.text = "⏳ 翻譯中..." }
        executor.execute {
            val translated = translateWithRetry(combinedText)
            mainHandler.post {
                resultTextView.text = if (translated.isNotBlank()) translated else "⚠️ 翻譯逾時，請確認網路連線"
            }
        }
    }

    private fun extractEnglishNodes(node: AccessibilityNodeInfo?, list: MutableList<String>) {
        if (node == null || !node.isVisibleToUser) return
        val text = node.text?.toString()?.trim() ?: ""
        if (isMeaningfulEnglish(text)) list.add(text)
        for (i in 0 until node.childCount) {
            extractEnglishNodes(node.getChild(i), list)
        }
    }

    private fun isMeaningfulEnglish(text: String): Boolean {
        if (text.length < 8) return false
        val enCount = text.count { it in 'a'..'z' || it in 'A'..'Z' }
        val zhCount = text.count { it.code in 0x4E00..0x9FA5 }
        return enCount > 6 && (zhCount.toFloat() / text.length) < 0.15f
    }

    private fun translateWithRetry(text: String): String {
        for (i in 1..2) {
            val res = translateToTraditionalChinese(text)
            if (res.isNotBlank()) return res
            Thread.sleep(400)
        }
        return ""
    }

    private fun translateToTraditionalChinese(text: String): String {
        return try {
            val encoded = URLEncoder.encode(text, "UTF-8")
            val urlStr = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-TW&dt=t&q=$encoded"
            val conn = (URL(urlStr).openConnection() as HttpURLConnection).apply {
                requestMethod = "GET"
                connectTimeout = 6000
                readTimeout = 6000
                setRequestProperty("User-Agent", "Mozilla/5.0")
            }
            if (conn.responseCode != 200) return ""
            val response = conn.inputStream.bufferedReader().use { it.readText() }
            val jsonArray = JSONArray(response).getJSONArray(0)
            val sb = StringBuilder()
            for (i in 0 until jsonArray.length()) {
                val sentence = jsonArray.getJSONArray(i).optString(0)
                if (sentence.isNotEmpty()) sb.append(sentence)
            }
            sb.toString()
        } catch (e: Exception) { "" }
    }

    override fun onInterrupt() {}

    override fun onDestroy() {
        super.onDestroy()
        if (::floatingRootLayout.isInitialized) {
            try {
                windowManager.removeView(floatingRootLayout)
            } catch (e: Exception) {}
        }
    }
}
