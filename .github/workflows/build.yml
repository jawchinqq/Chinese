name: Auto Generate & Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: 1. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 2. Create Files & Build APK
        shell: bash
        run: |
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/java/com/example/screeninstanttranslator

          printf '%s\n' \
            'pluginManagement {' \
            '    repositories {' \
            '        google()' \
            '        mavenCentral()' \
            '        gradlePluginPortal()' \
            '    }' \
            '}' \
            'dependencyResolutionManagement {' \
            '    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)' \
            '    repositories {' \
            '        google()' \
            '        mavenCentral()' \
            '    }' \
            '}' \
            'rootProject.name = "ScreenInstantTranslator"' \
            "include ':app'" > settings.gradle

          printf '%s\n' \
            'plugins {' \
            "    id 'com.android.application' version '8.2.0' apply false" \
            "    id 'org.jetbrains.kotlin.android' version '1.9.20' apply false" \
            '}' > build.gradle

          printf '%s\n' \
            'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' \
            'android.useAndroidX=true' \
            'kotlin.code.style=official' \
            'android.nonTransitiveRClass=true' > gradle.properties

          printf '%s\n' \
            'plugins {' \
            "    id 'com.android.application'" \
            "    id 'org.jetbrains.kotlin.android'" \
            '}' \
            'android {' \
            "    namespace 'com.example.screeninstanttranslator'" \
            '    compileSdk 34' \
            '    defaultConfig {' \
            '        applicationId "com.example.screeninstanttranslator"' \
            '        minSdk 26' \
            '        targetSdk 34' \
            '        versionCode 1' \
            '        versionName "1.0"' \
            '    }' \
            '    compileOptions {' \
            '        sourceCompatibility JavaVersion.VERSION_17' \
            '        targetCompatibility JavaVersion.VERSION_17' \
            '    }' \
            '    kotlinOptions {' \
            "        jvmTarget = '17'" \
            '    }' \
            '}' \
            'dependencies {' \
            "    implementation 'androidx.appcompat:appcompat:1.6.1'" \
            "    implementation 'androidx.core:core-ktx:1.12.0'" \
            '}' > app/build.gradle

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' \
            '    <uses-permission android:name="android.permission.INTERNET" />' \
            '    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />' \
            '    <application' \
            '        android:allowBackup="true"' \
            '        android:label="全螢幕即時翻譯"' \
            '        android:supportsRtl="true"' \
            '        android:theme="@style/Theme.AppCompat.Light.NoActionBar">' \
            '        <activity android:name=".MainActivity" android:exported="true">' \
            '            <intent-filter>' \
            '                <action android:name="android.intent.action.MAIN" />' \
            '                <category android:name="android.intent.category.LAUNCHER" />' \
            '            </intent-filter>' \
            '        </activity>' \
            '        <service' \
            '            android:name=".ScreenTranslatorService"' \
            '            android:exported="true"' \
            '            android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">' \
            '            <intent-filter>' \
            '                <action android:name="android.accessibilityservice.AccessibilityService" />' \
            '            </intent-filter>' \
            '            <meta-data' \
            '                android:name="android.accessibilityservice"' \
            '                android:resource="@xml/accessibility_service_config" />' \
            '        </service>' \
            '    </application>' \
            '</manifest>' > app/src/main/AndroidManifest.xml

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"' \
            '    android:accessibilityEventTypes="typeWindowContentChanged|typeWindowStateChanged|typeViewScrolled"' \
            '    android:accessibilityFeedbackType="feedbackGeneric"' \
            '    android:accessibilityFlags="flagReportViewIds|flagRetrieveInteractiveWindows"' \
            '    android:canRetrieveWindowContent="true"' \
            '    android:notificationTimeout="300" />' > app/src/main/res/xml/accessibility_service_config.xml

          printf '%s\n' \
            'package com.example.screeninstanttranslator' \
            'import android.content.Intent' \
            'import android.net.Uri' \
            'import android.os.Bundle' \
            'import android.provider.Settings' \
            'import android.view.Gravity' \
            'import android.widget.Button' \
            'import android.widget.LinearLayout' \
            'import android.widget.TextView' \
            'import android.widget.Toast' \
            'import androidx.appcompat.app.AppCompatActivity' \
            'class MainActivity : AppCompatActivity() {' \
            '    override fun onCreate(savedInstanceState: Bundle?) {' \
            '        super.onCreate(savedInstanceState)' \
            '        val layout = LinearLayout(this).apply {' \
            '            orientation = LinearLayout.VERTICAL' \
            '            gravity = Gravity.CENTER' \
            '            setPadding(64, 64, 64, 64)' \
            '        }' \
            '        val title = TextView(this).apply {' \
            '            text = "📱 全螢幕跨 App 自動翻譯"' \
            '            textSize = 22f' \
            '            setPadding(0, 0, 0, 32)' \
            '        }' \
            '        val desc = TextView(this).apply {' \
            '            text = "請依序開啟以下兩個權限，即可在螢幕上顯示懸浮球，跨 App 自動讀取畫面英文並即時翻成繁體中文："' \
            '            textSize = 15f' \
            '            setPadding(0, 0, 0, 48)' \
            '        }' \
            '        val btnOverlay = Button(this).apply {' \
            '            text = "步驟 1：允許「顯示於其他應用程式上層」"' \
            '            setOnClickListener {' \
            '                if (!Settings.canDrawOverlays(this@MainActivity)) {' \
            '                    startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))' \
            '                } else {' \
            '                    Toast.makeText(this@MainActivity, "✅ 懸浮視窗權限已開啟！", Toast.LENGTH_SHORT).show()' \
            '                }' \
            '            }' \
            '        }' \
            '        val btnAccessibility = Button(this).apply {' \
            '            text = "步驟 2：開啟「無障礙服務 (全螢幕即時翻譯)」"' \
            '            setOnClickListener {' \
            '                startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))' \
            '                Toast.makeText(this@MainActivity, "請找到「全螢幕即時翻譯」並將開關打開", Toast.LENGTH_LONG).show()' \
            '            }' \
            '        }' \
            '        layout.addView(title)' \
            '        layout.addView(desc)' \
            '        layout.addView(btnOverlay)' \
            '        layout.addView(btnAccessibility)' \
            '        setContentView(layout)' \
            '    }' \
            '}' > app/src/main/java/com/example/screeninstanttranslator/MainActivity.kt

          printf '%s\n' \
            'package com.example.screeninstanttranslator' \
            'import android.accessibilityservice.AccessibilityService' \
            'import android.graphics.Color' \
            'import android.graphics.PixelFormat' \
            'import android.graphics.drawable.GradientDrawable' \
            'import android.os.Handler' \
            'import android.os.Looper' \
            'import android.view.Gravity' \
            'import android.view.MotionEvent' \
            'import android.view.View' \
            'import android.view.WindowManager' \
            'import android.view.accessibility.AccessibilityEvent' \
            'import android.view.accessibility.AccessibilityNodeInfo' \
            'import android.widget.LinearLayout' \
            'import android.widget.ScrollView' \
            'import android.widget.TextView' \
            'import org.json.JSONArray' \
            'import java.net.HttpURLConnection' \
            'import java.net.URL' \
            'import java.net.URLEncoder' \
            'import java.util.concurrent.Executors' \
            'class ScreenTranslatorService : AccessibilityService() {' \
            '    private lateinit var windowManager: WindowManager' \
            '    private lateinit var floatingRootLayout: LinearLayout' \
            '    private lateinit var toggleButton: TextView' \
            '    private lateinit var resultScrollView: ScrollView' \
            '    private lateinit var resultTextView: TextView' \
            '    private var isAutoTranslating = false' \
            '    private var lastExtractedText = ""' \
            '    private val executor = Executors.newSingleThreadExecutor()' \
            '    private val mainHandler = Handler(Looper.getMainLooper())' \
            '    private var debounceRunnable: Runnable? = null' \
            '    override fun onServiceConnected() {' \
            '        super.onServiceConnected()' \
            '        setupFloatingOverlay()' \
            '    }' \
            '    private fun setupFloatingOverlay() {' \
            '        windowManager = getSystemService(WINDOW_SERVICE) as WindowManager' \
            '        val params = WindowManager.LayoutParams(' \
            '            WindowManager.LayoutParams.WRAP_CONTENT,' \
            '            WindowManager.LayoutParams.WRAP_CONTENT,' \
            '            WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,' \
            '            WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,' \
            '            PixelFormat.TRANSLUCENT' \
            '        ).apply {' \
            '            gravity = Gravity.TOP or Gravity.START' \
            '            x = 20' \
            '            y = 250' \
            '        }' \
            '        floatingRootLayout = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }' \
            '        toggleButton = TextView(this).apply {' \
            '            text = "🌐 點擊啟動即時翻"' \
            '            setTextColor(Color.WHITE)' \
            '            textSize = 14f' \
            '            setPadding(32, 20, 32, 20)' \
            '            background = GradientDrawable().apply {' \
            '                setColor(Color.parseColor("#E61A73E8"))' \
            '                cornerRadius = 50f' \
            '            }' \
            '        }' \
            '        resultTextView = TextView(this).apply {' \
            '            setTextColor(Color.WHITE)' \
            '            textSize = 14.5f' \
            '            setLineSpacing(8f, 1.1f)' \
            '            setPadding(28, 24, 28, 24)' \
            '            text = "等待畫面英文內容..."' \
            '        }' \
            '        resultScrollView = ScrollView(this).apply {' \
            '            visibility = View.GONE' \
            '            background = GradientDrawable().apply {' \
            '                setColor(Color.parseColor("#D91E1E1E"))' \
            '                cornerRadius = 28f' \
            '                setStroke(2, Color.parseColor("#4DFFFFFF"))' \
            '            }' \
            '            layoutParams = LinearLayout.LayoutParams(820, 650).apply { topMargin = 12 }' \
            '            addView(resultTextView)' \
            '        }' \
            '        floatingRootLayout.addView(toggleButton)' \
            '        floatingRootLayout.addView(resultScrollView)' \
            '        windowManager.addView(floatingRootLayout, params)' \
            '        var initialX = 0' \
            '        var initialY = 0' \
            '        var initialTouchX = 0f' \
            '        var initialTouchY = 0f' \
            '        toggleButton.setOnTouchListener { _, event ->' \
            '            when (event.action) {' \
            '                MotionEvent.ACTION_DOWN -> {' \
            '                    initialX = params.x' \
            '                    initialY = params.y' \
            '                    initialTouchX = event.rawX' \
            '                    initialTouchY = event.rawY' \
            '                    true' \
            '                }' \
            '                MotionEvent.ACTION_MOVE -> {' \
            '                    params.x = initialX + (event.rawX - initialTouchX).toInt()' \
            '                    params.y = initialY + (event.rawY - initialTouchY).toInt()' \
            '                    windowManager.updateViewLayout(floatingRootLayout, params)' \
            '                    true' \
            '                }' \
            '                MotionEvent.ACTION_UP -> {' \
            '                    if (Math.abs(event.rawX - initialTouchX) < 15 && Math.abs(event.rawY - initialTouchY) < 15) {' \
            '                        toggleTranslationMode()' \
            '                    }' \
            '                    true' \
            '                }' \
            '                else -> false' \
            '            }' \
            '        }' \
            '    }' \
            '    private fun toggleTranslationMode() {' \
            '        isAutoTranslating = !isAutoTranslating' \
            '        if (isAutoTranslating) {' \
            '            toggleButton.text = "🟢 即時翻譯中 (點我收起)"' \
            '            toggleButton.background = GradientDrawable().apply {' \
            '                setColor(Color.parseColor("#E60F9D58"))' \
            '                cornerRadius = 50f' \
            '            }' \
            '            resultScrollView.visibility = View.VISIBLE' \
            '            lastExtractedText = ""' \
            '            scanAndTranslateScreen()' \
            '        } else {' \
            '            toggleButton.text = "🌐 點擊啟動即時翻"' \
            '            toggleButton.background = GradientDrawable().apply {' \
            '                setColor(Color.parseColor("#E61A73E8"))' \
            '                cornerRadius = 50f' \
            '            }' \
            '            resultScrollView.visibility = View.GONE' \
            '        }' \
            '    }' \
            '    override fun onAccessibilityEvent(event: AccessibilityEvent?) {' \
            '        if (!isAutoTranslating) return' \
            '        if (event?.packageName == packageName) return' \
            '        debounceRunnable?.let { mainHandler.removeCallbacks(it) }' \
            '        debounceRunnable = Runnable { scanAndTranslateScreen() }' \
            '        mainHandler.postDelayed(debounceRunnable!!, 500)' \
            '    }' \
            '    private fun scanAndTranslateScreen() {' \
            '        val rootNode = rootInActiveWindow ?: return' \
            '        val englishParagraphs = mutableListOf<String>()' \
            '        extractEnglishNodes(rootNode, englishParagraphs)' \
            '        val combinedText = englishParagraphs.distinct().take(12).joinToString("\n\n")' \
            '        if (combinedText.isBlank() || combinedText == lastExtractedText) return' \
            '        lastExtractedText = combinedText' \
            '        mainHandler.post { resultTextView.text = "⏳ 正在即時翻譯畫面內容..." }' \
            '        executor.execute {' \
            '            val translated = translateToTraditionalChinese(combinedText)' \
            '            mainHandler.post {' \
            '                resultTextView.text = if (translated.isNotBlank()) translated else "⚠️ 翻譯連線失敗，請檢查網路"' \
            '            }' \
            '        }' \
            '    }' \
            '    private fun extractEnglishNodes(node: AccessibilityNodeInfo?, list: MutableList<String>) {' \
            '        if (node == null || !node.isVisibleToUser) return' \
            '        val text = node.text?.toString()?.trim() ?: ""' \
            '        if (isMeaningfulEnglish(text)) list.add(text)' \
            '        for (i in 0 until node.childCount) {' \
            '            extractEnglishNodes(node.getChild(i), list)' \
            '        }' \
            '    }' \
            '    private fun isMeaningfulEnglish(text: String): Boolean {' \
            '        if (text.length < 8) return false' \
            '        val enCount = text.count { it in '\''a'\''..'\''z'\'' || it in '\''A'\''..'\''Z'\'' }' \
            '        val zhCount = text.count { it.code in 0x4E00..0x9FA5 }' \
            '        return enCount > 6 && (zhCount.toFloat() / text.length) < 0.15f' \
            '    }' \
            '    private fun translateToTraditionalChinese(text: String): String {' \
            '        return try {' \
            '            val encoded = URLEncoder.encode(text, "UTF-8")' \
            '            val urlStr = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-TW&dt=t&q=$encoded"' \
            '            val conn = (URL(urlStr).openConnection() as HttpURLConnection).apply {' \
            '                requestMethod = "GET"' \
            '                connectTimeout = 5000' \
            '                readTimeout = 5000' \
            '            }' \
            '            val response = conn.inputStream.bufferedReader().use { it.readText() }' \
            '            val jsonArray = JSONArray(response).getJSONArray(0)' \
            '            val sb = StringBuilder()' \
            '            for (i in 0 until jsonArray.length()) {' \
            '                val sentence = jsonArray.getJSONArray(i).optString(0)' \
            '                if (sentence.isNotEmpty()) sb.append(sentence)' \
            '            }' \
            '            sb.toString()' \
            '        } catch (e: Exception) { "" }' \
            '    }' \
            '    override fun onInterrupt() {}' \
            '    override fun onDestroy() {' \
            '        super.onDestroy()' \
            '        if (::floatingRootLayout.isInitialized) windowManager.removeView(floatingRootLayout)' \
            '    }' \
            '}' > app/src/main/java/com/example/screeninstanttranslator/ScreenTranslatorService.kt

          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip
          ./gradle-8.4/bin/gradle assembleDebug --no-daemon

      - name: 3. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTranslator-APK
          path: app/build/outputs/apk/debug/app-debug.apk
