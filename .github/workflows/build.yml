name: Auto Generate & Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: 1. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 2. Create Files & Build APK
        shell: bash
        run: |
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/java/com/example/screeninstanttranslator

          printf '%s\n' \
            'pluginManagement {' \
            '    repositories {' \
            '        google()' \
            '        mavenCentral()' \
            '        gradlePluginPortal()' \
            '    }' \
            '}' \
            'dependencyResolutionManagement {' \
            '    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)' \
            '    repositories {' \
            '        google()' \
            '        mavenCentral()' \
            '    }' \
            '}' \
            'rootProject.name = "ScreenInstantTranslator"' \
            "include ':app'" > settings.gradle

          printf '%s\n' \
            'plugins {' \
            "    id 'com.android.application' version '8.2.0' apply false" \
            "    id 'org.jetbrains.kotlin.android' version '1.9.20' apply false" \
            '}' > build.gradle

          printf '%s\n' \
            'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' \
            'android.useAndroidX=true' \
            'kotlin.code.style=official' \
            'android.nonTransitiveRClass=true' > gradle.properties

          printf '%s\n' \
            'plugins {' \
            "    id 'com.android.application'" \
            "    id 'org.jetbrains.kotlin.android'" \
            '}' \
            'android {' \
            "    namespace 'com.example.screeninstanttranslator'" \
            '    compileSdk 34' \
            '    defaultConfig {' \
            '        applicationId "com.example.screeninstanttranslator"' \
            '        minSdk 26' \
            '        targetSdk 34' \
            '        versionCode 2' \
            '        versionName "1.1"' \
            '    }' \
            '    compileOptions {' \
            '        sourceCompatibility JavaVersion.VERSION_17' \
            '        targetCompatibility JavaVersion.VERSION_17' \
            '    }' \
            '    kotlinOptions {' \
            "        jvmTarget = '17'" \
            '    }' \
            '}' \
            'dependencies {' \
            "    implementation 'androidx.appcompat:appcompat:1.6.1'" \
            "    implementation 'androidx.core:core-ktx:1.12.0'" \
            '}' > app/build.gradle

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' \
            '    <uses-permission android:name="android.permission.INTERNET" />' \
            '    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />'
